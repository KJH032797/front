<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>구글로그인</title>
  <link rel="stylesheet" href="./구글.css">
</head>
<body>
  <div class="login-container">
    <div class="left">
      <div class="logo">
        <img src="../resources/images/G_logo.jpg">
      </div>

      <br />

      <div class="login-text">
        로그인
      </div>

      <br />

      <div class="login-subtext">
        Google 계정 사용
      </div>
    </div>

    <div class="right">
      <input type="text" placeholder="  이메일 또는 휴대전화">
      
      <br />

      <div class="forgot">
        이메일을 잊으셨나요?
      </div>

      <br />
      <br />

      <div class="guest">
        <span class="guest-info">
          내 컴퓨터가 아닌가요? 게스트 모드를 사용하여 비공개로 로그인하세요.
        </span>
        <span class="guest-link">
          게스트
          <br />
          모드 사용 방법 자세히 알아보기
        </span>
      </div>

      <br />

      <div class="buttons">
        <div class="sign-in">계정 만들기</div>
        <button class="next">다음</button>
      </div>
    </div>
  </div>
</body>
</html>
