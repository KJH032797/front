<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>연습문제05</title>
</head>
<body>
  <h1>주문관리</h1>

  <h3>주문자 정보</h3>
  
  <br />

  <label>1. 주문자명 : </label>
  <input type="text" name="name" placeholder="name">
  <br />
  <br />
  <label>2. email : </label>
  <input type="email" name="email" placeholder="123@example.com">
  <br />
  <br />
  <label>3. 홈페이지 : </label>
  <input type="url" name="homepage" placeholder="https://">

  <br />
  <br />
  <br />
  <br />

  <h3>주문정보</h3>
  
  <ul>
    <li>
      <label>상품명 : </label>
      <input type="text" name="product_name">
    </li>
    <br />
    <li>
      <label>주문수량 : </label>
      <input type="number" name="quantity" min="100" placeholder="최소 100">
    </li>
    <br />
    <li>
      <label>할인율 : </label>
      <input type="range" name="discount">
    </li>
    <br />
    <li>
      <label>요청사항 : </label>
      <textarea name="request" cols="25" rows="3"></textarea>
    </li>
  </ul>

  <br />
  <button>주문하기</button>

</body>
</html>
