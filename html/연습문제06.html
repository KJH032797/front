<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>연습문제06</title>
  <link rel="stylesheet" href="./연습문제06.css">
</head>
<body>
  <h1>회원가입</h1>

  <form>
    
    <div class="user-info">
    <h3>필수 입력 사항</h3>

    <label>ID</label>
    <input type="text" name="id" placeholder="아이디 10글자 이내" required="true">
    <button>중복확인</button>
    <br />
    <br />
    <label>비밀번호</label>
    <input type="password" name="pw" placeholder="영문, 숫자, 특수문자 포함 8자 이상" required="true">
    <br />
    <br />
    <label >비밀번호 확인</label>
    <input type="password" name="pw_confirm" required="true">
    <br />
    <br />
    <label>Email</label>
    <input type="email" name="email" required="true">
    <select name="email_domain">
      <option>직접입력</option>
      <option value="naver.com">naver.com</option>
      <option value="daum.net">daum.net</option>
      <option value="gmail.com">gmail.com</option>
    </select>
    </div>

    <hr />

    <h3>추가 정보</h3>

    <label>프로필 사진 : </label>
    <input type="file" name="profile">
    <br />
    <br />
    <label>성별 : </label>
    <input type="radio" name="gender" value="male"> 남성
    <input type="radio" name="gender" value="female"> 여성
    <br />
    <br />
    <label>생년월일 : </label>
    <input type="date" name="birth">
    <br />
    <br />
    <label>취미 : </label>
    <br />
    <input type="checkbox" name="hobby" value="게임"> 게임
    <input type="checkbox" name="hobby" value="운동"> 운동
    <input type="checkbox" name="hobby" value="취침"> 취침
    <br />
    <input type="checkbox" name="hobby" value="댄스"> 댄스
    <input type="checkbox" name="hobby" value="노래"> 노래
    <input type="checkbox" name="hobby" value="공부"> 공부
    <br />
    <input type="checkbox" name="hobby" value="기타"> 기타 : 
  <input type="text" name="hobby_etc">

    <br />
    <br />
    <label>자기소개</label>
    <br />
    <textarea name="self_intro" cols="55" rows="6"></textarea>
    <br />
    <button type="submit">회원가입</button>
    <button type="reset">다시입력</button>
    <button>이전으로</button>

  </form>


</body>
</html>
